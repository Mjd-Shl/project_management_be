name: Backend CI

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  verify:
    name: Backend checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: project_management
          POSTGRES_USER: project_dev
          POSTGRES_PASSWORD: ci_only
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U project_dev -d project_management"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://project_dev:ci_only@127.0.0.1:5432/project_management

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test